<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | UHV CELL NBKRIST</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="shortcut icon" href="favicon.png">
    <link rel="apple-touch-icon" href="favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="admin-style.css">
</head>

<body>

    <header>
        <div class="container navbar">
            <a href="index.html" class="logo">
                <img src="logo.jpg" alt="Logo">
                <span>UHV CELL NBKRIST</span>
            </a>
            <!-- Minimal Nav for Login Page -->
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </div>
    </header>

    <div class="hero">
        <div class="hero-bg"></div>
        <div class="container" style="display: flex; justify-content: center; width: 100%;">
            <div class="auth-form-container fade-in">
                <div style="font-size: 3rem; color: var(--secondary); margin-bottom: 20px;">
                    <i class="fa-solid fa-user-shield"></i>
                </div>
                <h2 style="margin-bottom: 30px;">Admin Login</h2>
                <form id="loginForm">
                    <div class="form-group">
                        <label for="username">Username</label>
                        <input type="text" id="username" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" required>
                    </div>
                    <button type="submit" class="btn btn-primary" style="width: 100%;">Login to Dashboard</button>
                    <p id="error-msg" style="color: var(--accent); margin-top: 15px; display: none;">Invalid
                        credentials!</p>
                </form>
            </div>
        </div>
    </div>

    <footer>
        <div class="container">
            <div class="copyright">&copy; 2025 UHV CELL NBKRIST.</div>
        </div>
    </footer>

    <script src="admin.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', function (e) {
            e.preventDefault();
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;

            // Get registered users from localStorage
            const users = JSON.parse(localStorage.getItem('uhvAdminUsers') || '[]');

            // Check against registered users
            const validUser = users.find(u => u.username === user && u.password === pass);

            // Also check hardcoded fallback
            if (validUser || (user === 'admin' && pass === 'admin123')) {
                localStorage.setItem('uhvAdminLoggedIn', 'true');
                if (validUser) {
                    localStorage.setItem('uhvAdminName', validUser.firstName);
                } else {
                    localStorage.setItem('uhvAdminName', 'Admin');
                }
                window.location.href = 'index.html';
            } else {
                document.getElementById('error-msg').style.display = 'block';
            }
        });
    </script>
</body>

</html>
